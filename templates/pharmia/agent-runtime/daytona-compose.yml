# Self-hosted Daytona — sandbox execution backend for Paperclip agents.
# Hardened/minimal (7 services; dropped dex, ssh-gateway, registry-ui, pgadmin, maildev,
# jaeger, otel-collector). Deploy via Dokploy on the QA remote server (PH_38BWrBFFVYaGINxbTb,
# 51.222.25.80). Secrets are Dokploy env (${DAYTONA_*}) — never hardcode. Pin v0.184.0.
#
# Gotchas (from research): apiUrl the Paperclip provider uses MUST be https://daytona.bentostudio.io/api
# (the /api suffix is required); a snapshot image CANNOT be tagged :latest (use :0.1.0 / digest);
# api+runner must be privileged (DinD); RESOURCE_LIMITS_DISABLED is forced in DinD.
name: daytona
services:
  api:
    image: daytonaio/daytona-api:v0.184.0
    privileged: true
    restart: always
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=docker-compose
      - PORT=3000
      - RUN_MIGRATIONS=true
      - ADMIN_API_KEY=${DAYTONA_ADMIN_API_KEY}
      - SKIP_USER_EMAIL_VERIFICATION=true
      - OIDC_CLIENT_ID=daytona
      - OIDC_ISSUER_BASE_URL=http://api:3000/api
      - OIDC_AUDIENCE=daytona
      - ENCRYPTION_KEY=${DAYTONA_ENCRYPTION_KEY}
      - ENCRYPTION_SALT=${DAYTONA_ENCRYPTION_SALT}
      - HEALTH_CHECK_API_KEY=${DAYTONA_HEALTH_KEY}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=daytona
      - DB_PASSWORD=${DAYTONA_DB_PASSWORD}
      - DB_DATABASE=daytona
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEFAULT_SNAPSHOT=pharmia-agent-runtime
      - TRANSIENT_REGISTRY_URL=http://registry:6000
      - TRANSIENT_REGISTRY_ADMIN=admin
      - TRANSIENT_REGISTRY_PASSWORD=${DAYTONA_REGISTRY_PASSWORD}
      - TRANSIENT_REGISTRY_PROJECT_ID=daytona
      - INTERNAL_REGISTRY_URL=http://registry:6000
      - INTERNAL_REGISTRY_ADMIN=admin
      - INTERNAL_REGISTRY_PASSWORD=${DAYTONA_REGISTRY_PASSWORD}
      - INTERNAL_REGISTRY_PROJECT_ID=daytona
      - S3_ENDPOINT=http://minio:9000
      - S3_STS_ENDPOINT=http://minio:9000/minio/v1/assume-role
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${DAYTONA_S3_KEY}
      - S3_SECRET_KEY=${DAYTONA_S3_SECRET}
      - S3_DEFAULT_BUCKET=daytona
      - S3_ACCOUNT_ID=/
      - S3_ROLE_NAME=/
      - PROXY_DOMAIN=daytona.bentostudio.io
      - PROXY_PROTOCOL=https
      - PROXY_API_KEY=${DAYTONA_PROXY_KEY}
      - PROXY_TEMPLATE_URL=https://{{PORT}}-{{sandboxId}}.daytona.bentostudio.io
      - DASHBOARD_URL=https://daytona.bentostudio.io/dashboard
      - DASHBOARD_BASE_API_URL=https://daytona.bentostudio.io
      - DONT_SERVE_DASHBOARD=false
      - DEFAULT_RUNNER_DOMAIN=runner:3003
      - DEFAULT_RUNNER_API_URL=http://runner:3003
      - DEFAULT_RUNNER_PROXY_URL=http://runner:3003
      - DEFAULT_RUNNER_API_KEY=${DAYTONA_RUNNER_TOKEN}
      - DEFAULT_RUNNER_CPU=2
      - DEFAULT_RUNNER_MEMORY=4
      - DEFAULT_RUNNER_DISK=20
      - DEFAULT_RUNNER_NAME=default
      - DEFAULT_REGION_ID=us
      - DEFAULT_REGION_NAME=us
      - DEFAULT_ORG_QUOTA_TOTAL_CPU_QUOTA=6
      - DEFAULT_ORG_QUOTA_TOTAL_MEMORY_QUOTA=6
      - DEFAULT_ORG_QUOTA_TOTAL_DISK_QUOTA=30
      - DEFAULT_ORG_QUOTA_MAX_CPU_PER_SANDBOX=4
      - DEFAULT_ORG_QUOTA_MAX_MEMORY_PER_SANDBOX=4
      - DEFAULT_ORG_QUOTA_MAX_DISK_PER_SANDBOX=15
      - OTEL_ENABLED=false
      - NOTIFICATION_GATEWAY_DISABLED=true
      - MAINTENANCE_MODE=false
    depends_on: [db, runner, redis, registry, minio]
    networks: [daytona-internal]
    deploy:
      resources:
        limits:
          memory: 1024M

  runner:
    image: daytonaio/daytona-runner:v0.184.0
    privileged: true
    restart: always
    environment:
      - ENVIRONMENT=production
      - API_PORT=3003
      - DAYTONA_RUNNER_TOKEN=${DAYTONA_RUNNER_TOKEN}
      - DAYTONA_API_URL=http://api:3000/api
      - RUNNER_DOMAIN=runner
      - LOG_FILE_PATH=/home/daytona/runner/runner.log
      - RESOURCE_LIMITS_DISABLED=true
      - SSH_GATEWAY_ENABLE=false
      - INTER_SANDBOX_NETWORK_ENABLED=false
      - BUILD_CPU_CORES=2
      - BUILD_MEMORY_GB=4
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${DAYTONA_S3_KEY}
      - AWS_SECRET_ACCESS_KEY=${DAYTONA_S3_SECRET}
      - AWS_DEFAULT_BUCKET=daytona
    networks: [daytona-internal]
    deploy:
      resources:
        limits:
          memory: 1536M

  proxy:
    image: daytonaio/daytona-proxy:v0.184.0
    restart: always
    environment:
      - DAYTONA_API_URL=http://api:3000/api
      - PROXY_PORT=4000
      - PROXY_API_KEY=${DAYTONA_PROXY_KEY}
      - PROXY_PROTOCOL=https
      - TOOLBOX_ONLY_MODE=true
      - PREVIEW_WARNING_ENABLED=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OIDC_CLIENT_ID=daytona
      - OIDC_CLIENT_SECRET=
      - OIDC_DOMAIN=http://api:3000/api
      - OIDC_AUDIENCE=daytona
    networks: [daytona-internal]
    deploy:
      resources:
        limits:
          memory: 256M

  db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=daytona
      - POSTGRES_PASSWORD=${DAYTONA_DB_PASSWORD}
      - POSTGRES_DB=daytona
    volumes:
      - db_data:/var/lib/postgresql/18/docker
    networks: [daytona-internal]
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [daytona-internal]
    deploy:
      resources:
        limits:
          memory: 192M

  registry:
    image: registry:2.8.2
    restart: always
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: registry:6000
    volumes:
      - registry_data:/var/lib/registry
    networks: [daytona-internal]
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:latest
    restart: always
    environment:
      - MINIO_ROOT_USER=${DAYTONA_S3_KEY}
      - MINIO_ROOT_PASSWORD=${DAYTONA_S3_SECRET}
      - MINIO_IDENTITY_STS_EXPIRY=24h
    command: server /data
    volumes:
      - minio_data:/data
    networks: [daytona-internal]
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  db_data: {}
  registry_data: {}
  minio_data: {}

networks:
  daytona-internal: {}
