# Dex OIDC issuer for self-hosted Daytona on QA.
# Replicated from upstream daytonaio/daytona docker/dex/config.yaml, with two changes:
#   * the `daytona` static client is CONFIDENTIAL (real secret) instead of public, so
#     api+proxy OIDC_CLIENT_SECRET is a generated value (DAYTONA_DEX_CLIENT_SECRET).
#   * issuer is the internal docker-network URL (http://dex:5556/dex) — the api fetches
#     and validates against this. Paperclip authenticates via the admin API key, not the
#     interactive OIDC flow, so the issuer only needs to be reachable + internally consistent.
# NOTE: dex does NOT expand $VAR in staticClients[].secret (literal string), but it DOES
# support `secretEnv: <NAME>` (no $). The dex container gets DAYTONA_DEX_CLIENT_SECRET in
# its environment; dex reads it at boot. Ref: dexidp/dex PR #1664, issue #4212.
issuer: http://dex:5556/dex
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins: ['*']
  allowedHeaders: ['x-requested-with']

staticClients:
  - id: daytona
    secretEnv: DAYTONA_DEX_CLIENT_SECRET
    name: 'Daytona'
    redirectURIs:
      - 'https://daytona.bentostudio.io'
      - 'https://daytona.bentostudio.io/api/oauth2-redirect.html'
      - 'https://daytona.bentostudio.io/callback'
      - 'https://proxy.daytona.bentostudio.io/callback'

enablePasswordDB: true
