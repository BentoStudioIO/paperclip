schema: "paperclip/v1"
# Every agent below uses the same codex_local adapter; declare it once here and let
# each agent override only its model via the `model:` shorthand. Any agent needing a
# different adapter can still add an explicit `adapter:` block (it overrides these).
adapterDefaults:
  type: "codex_local"
  config:
    dangerouslyBypassApprovalsAndSandbox: true
agents:
  # capabilities: ONE crisp sentence — what the agent OWNS / its primary deliverable +
  # a scope boundary. The importer (company-portability.ts) reads THIS key into the
  # agents.capabilities DB column, which paperclipListAgents surfaces to routing agents
  # (e.g. the CEO) so they delegate by primary deliverable instead of pattern-matching prose.
  ceo:
    role: "ceo"
    model: "gpt-5.5"
    capabilities: 'Owns strategy, prioritization, cross-functional routing, and board comms; answers quick @mentions directly but delegates ALL execution to a lead — never does IC work itself.'
  bug-hunter:
    role: "qa"
    model: "gpt-5.5"
    capabilities: 'Engineering pipeline (on-demand) — reproduces a reported defect/regression, finds root cause, and writes the regression test; investigation only, does not ship the fix.'
  devops:
    role: "devops"
    model: "gpt-5.5"
    capabilities: 'Owns infrastructure operations — deployments, service management, DNS, monitoring, rollback, and incident response across the VPS fleet; runtime ops, not application code.'
  e2e:
    role: "qa"
    model: "gpt-5.5"
    capabilities: 'Engineering pipeline (on-demand) — owns end-to-end test coverage: flow discovery, Playwright scenario maintenance, suite runs, and pass/fail reporting; no production code.'
  engineering-lead:
    role: "cto"
    model: "gpt-5.5"
    capabilities: 'Owns ALL code, bugs, features, infra, deploys, and devtools AND release/QA artifacts (changelogs, release notes, version bumps); orchestrates the eng pipeline — never external marketing.'
  implementer:
    role: "engineer"
    model: "gpt-5.5"
    capabilities: 'Engineering pipeline (sequential) — executes an APPROVED plan into code, tests, and config via red-green TDD; implements only, never plans or self-approves; never pushes or merges.'
  quebec-legal:
    role: "legal"
    model: "gpt-5.5"
    capabilities: 'Authority on law and compliance (Law 25/P-39.1, R-22.1, P-10, TGV/MSSS, PIPEDA, SaMD); verbatim-source-first, no fact without a citation; defers pharmacy-billing/standards to pharmacy-lead.'
  pharmacy-lead:
    role: "pharmacy"
    model: "gpt-5.5"
    capabilities: 'Authority on pharmacist scope-of-practice, RAMQ billing, OPQ standards, and clinical/corpus/skill correctness; no fact without a source; defers privacy/civil/SaMD/TGV to quebec-legal.'
  reflect:
    role: "meta"
    model: "gpt-5.5"
    capabilities: 'The meta-agent — evolves agent instructions, skills, and prompts from observed patterns; proposes changes for human approval, never ships product code or other deliverables.'
  planner:
    role: "pm"
    model: "gpt-5.5"
    capabilities: 'Engineering pipeline (sequential) — produces the structured implementation plan (requirements, tasks, dependencies, acceptance criteria) before the implementer starts; plans only, writes no code.'
  researcher:
    role: "researcher"
    model: "gpt-5.5"
    capabilities: 'Engineering pipeline (sequential, first) — finds existing solutions, evaluates libraries, and maps what the codebase already provides before any planning or implementation; research only.'
  reviewer:
    role: "qa"
    model: "gpt-5.5"
    capabilities: 'Engineering pipeline (sequential, last) — final verification of finished artifacts (code, docs, plans, configs); picks the review mode and approves or blocks with concrete findings; never authors the work.'
  security-agent:
    role: "security"
    model: "gpt-5.5"
    capabilities: 'Engineering pipeline (on-demand) — proactive security scanning (secrets, dependency CVEs, SAST, container/config, authz surface); reports findings, never auto-fixes.'
  ai-product-observer:
    role: "observer"
    model: "gpt-5.5"
    capabilities: 'Triage-only observer for Atlas + the agent/eval platform — reads detector-attached evidence for answer/render/clinical-tool quality, fabrication, and ring/cost drift, then files child Issues for the eng pipeline; never edits code or calls host CLIs.'
  clinical-flow-observer:
    role: "observer"
    model: "gpt-5.5"
    capabilities: 'Triage-only observer for the real-time clinical pipelines (Echo analyzer, phone/LiveKit, B2B consult) — reads evidence for silent failures and consent/ZDR drift and decomposes into child Issues; never edits code or calls host CLIs.'
  platform-observer:
    role: "observer"
    model: "gpt-5.5"
    capabilities: 'Triage-only observer for platform reliability + FinOps — reads evidence to confirm alert noise/coverage gaps, poller-cursor drops, and budget breaches, proposing rule diffs as Issues; never edits live rules or calls host CLIs.'
  growth-lead:
    role: "cmo"
    model: "gpt-5.5"
    capabilities: 'Owns EXTERNAL marketing, content, SEO, market intelligence, lead-scouting, and outreach — orchestrates the weekly Growth Brief; explicitly NOT internal release notes, changelogs, or engineering docs (those are engineering-lead).'
  market-intel:
    role: "analyst"
    model: "gpt-5.5"
    capabilities: 'Growth team analyst — produces internal funnel/activation/retention/growth numbers (pg canary) + the Atlas question corpus + an external dated pharmacy-land digest; analysis only, writes no copy and sends no outreach.'
  lead-scout:
    role: "sdr"
    model: "gpt-5.5"
    capabilities: 'Growth team prospecting analyst — crosses OPQ, Twenty, online signals, and PLG signups into a ranked DM list and writes qualified opportunities to Twenty; the human sends every DM, it never sends a message.'
  content:
    role: "marketing"
    model: "gpt-5.5"
    capabilities: 'Growth team maker — composes EXTERNAL FR-Québec marketing/positioning copy from market-intel topics, gates SEO fit, routes clinical/legal claims out; NOT code-derived release notes/changelogs; drafts only, human approves every publish.'
  signup-ingest:
    role: "sdr"
    model: "gpt-5.5"
    capabilities: 'Single-shot Discord-triggered watcher — on a "New Signup" match, enriches/creates the Twenty Person, detects pharmacy ownership, attaches a signup Note, and posts ONE summary back; never narrates, never general work.'
  booking-ingest:
    role: "sdr"
    model: "gpt-5.5"
    capabilities: 'Single-shot Discord-triggered watcher — on a "New Booking" match, enriches the lead and upserts the MEETING Opportunity in Twenty, attaches a Note, and posts ONE summary back; never narrates, never general work.'
  code-health:
    role: "agent"
    model: "gpt-5.5"
  dokploy-ops:
    role: "agent"
    model: "gpt-5.5"
company:
  attachmentMaxBytes: 10485760
routines:
  # NOTE: Routines are org-as-code and imported via company import --include tasks.
  # Keep dormant routines watchable but disabled (status: paused, triggers enabled:
  # false). Only daily Atlas + daily alert health are active by default.
  # Assignee agent + description are captured as comments because the manifest
  # routine schema only reads triggers / variables / concurrencyPolicy /
  # catchUpPolicy / status. Assignee + description bind at the TASK.md level.
  code-health:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 9 * * 1"
        label: "Weekly Monday morning"
        timezone: "UTC"
        enabled: false
  weekly-growth-brief:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 13 * * 1"
        label: "Weekly Monday afternoon"
        timezone: "UTC"
        enabled: false

  # ── Dependency & service release watch (WEBHOOK) ──────────────────────────
  # assignee: code-health
  # purpose: judge ONE GitHub release per fire (worthwhile vs premature). The n8n
  #          "Dep & Service Release Watch" workflow polls releases.atom feeds
  #          (derived from package.json + service map), dedups, and POSTs each new
  #          release here. No cron in paperclip — paperclip only receives + judges.
  # prompt SSOT: templates/pharmia/tasks/dep-release-watch/TASK.md
  # DISABLED until the n8n watcher is deployed + the webhook secret is wired.
  dep-release-watch:
    status: "paused"
    triggers:
      -
        kind: "webhook"
        label: "n8n release-watcher"
        signingMode: "bearer"
        enabled: false

  # ── n8n → paperclip migrations (2026-06-13) ───────────────────────────────
  # Replace live n8n workflows with paperclip routines. PAUSED + every trigger
  # enabled:false until the Forgejo webhook secret and the content agent's
  # deployed-runtime capabilities (Discord post, WordPress via the wp-pharmia CLI) are wired.
  # Prompt SSOT in tasks/<name>/TASK.md; assignee binds there.
  #
  # assignee: content — replaces n8n "Pharmia Github Notifications" (XqWpwDlBJwxbdQCi).
  #   Forgejo push to `qa` → FR pharmacist changelog → Discord #qa-updates.
  #   signingMode github_hmac accepts Forgejo's X-Hub-Signature-256 (GitHub-compatible).
  qa-changelog:
    status: "paused"
    triggers:
      -
        kind: "webhook"
        label: "Forgejo push (PharmaMate)"
        signingMode: "github_hmac"
        enabled: false
  #
  # assignee: content — replaces the 4-workflow n8n SEO pipeline (SEO Pharmia
  #   g6sl2x0XV15ao3dP + Relevance rOjfyJYMXgmBOChS + SEO+LinkedIn 3zhDw1vfDRfomPfZ
  #   + Templated 4IbUiJx7Xly8Hvad). Weekly: QC-health RSS → PLG-SEO relevance gate →
  #   WordPress + LinkedIn DRAFTS → Discord approval. Scheduled 2h before weekly-growth-brief
  #   (0 13) which reports what it shipped. Research=bx+Jina, WordPress=wp-pharmia CLI (both wired 2026-06-14).
  #   Carousel render + LinkedIn auto-post remain capability-gaps — see tasks/seo-content-run/TASK.md.
  seo-content-run:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 11 * * 1"
        label: "Weekly Monday morning (before Growth Brief)"
        timezone: "UTC"
        enabled: false

  # ── Tier-A host detectors (SCHEDULE) ──────────────────────────────────────
  # Tier-A host-detector
  # assignee: devops
  # purpose: Atlas thread/tool-health — unrendered tags, fabricated data, tool failures;
  #          + external clinical tools return expected shape (merged from daily-clinical-tool-health)
  #          + capability-gap detection (over-search / webSearch-fallback / missing-info -> upgrade suggestions)
  # prompt SSOT: templates/pharmia/tasks/daily-atlas-tool-health/TASK.md
  daily-atlas-tool-health:
    status: "active"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 10 * * *"
        label: "Daily Atlas health"
        timezone: "UTC"
        enabled: true
  # Tier-A host-detector
  # assignee: devops
  # purpose: Grafana fired-vs-expected + poller-cursor drops
  # prompt SSOT: templates/pharmia/tasks/daily-alert-health/TASK.md
  daily-alert-health:
    status: "active"
    triggers:
      -
        kind: "schedule"
        cronExpression: "30 9 * * *"
        label: "Daily alert health"
        timezone: "UTC"
        enabled: true
  # Tier-A host-detector
  # assignee: clinical-flow-observer
  # purpose: Consult forms never isComplete, confirm dead-ends
  daily-consultation-flow-health:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "5 10 * * *"
        label: "Daily consultation-flow health"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: security-agent
  # purpose: audit_log triggers installed, controls still fire (401 spikes → Grafana alert)
  daily-auth-integrity:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "45 9 * * *"
        label: "Daily auth integrity"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: ai-product-observer
  # purpose: Judge + USD-cost deltas vs baseline
  weekly-eval-drift:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 6 * * 2"
        label: "Weekly eval drift"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: ai-product-observer
  # purpose: Breaker/park/rescue + ring review (consumes atlas-report.ts)
  weekly-model-ring-review:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 9 * * 1"
        label: "Weekly model-ring review"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: security-agent
  # purpose: Every router declares a tenant policy
  weekly-authz-regression-audit:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 7 * * 2"
        label: "Weekly authz-regression audit"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: security-agent
  # purpose: Deployed Autumn config vs autumn.config.ts
  weekly-autumn-billing-drift:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 8 * * 2"
        label: "Weekly Autumn billing drift"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: clinical-flow-observer
  # purpose: Consent re-prompt coverage + audit writes
  weekly-consent-compliance-drift:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 9 * * 3"
        label: "Weekly consent-compliance drift"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: quebec-legal
  # purpose: comp TGV status + RAMQ infolettre check
  monthly-regulatory-drift:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 6 1 * *"
        label: "Monthly regulatory drift"
        timezone: "UTC"
        enabled: false

  # ── Tier-B sandbox routines (WEBHOOK / SCHEDULE) ──────────────────────────
  # Tier-B sandbox-routine
  # assignee: ai-product-observer
  # purpose: Sweep Inbox for detector Issues lacking an RCA verdict
  observer-issue-triage:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 11 * * *"
        label: "Daily observer issue triage"
        timezone: "UTC"
        enabled: false
  # Tier-B sandbox-routine
  # assignee: clinical-flow-observer
  # purpose: On echo-analyzer/STT/phone-config diff, assert bench-* ran + no ZDR-voiding key
  analyzer-stt-zdr-gate:
    status: "paused"
    triggers:
      -
        kind: "webhook"
        label: "echo-analyzer/STT/phone-config diff"
        timezone: "UTC"
        enabled: false
  # Tier-B sandbox-routine
  # assignee: e2e
  # purpose: Playwright mobile suite on web/web-next change (also wants a daily synthetic)
  mobile-webview-guard:
    status: "paused"
    triggers:
      -
        kind: "webhook"
        label: "web/web-next change"
        timezone: "UTC"
        enabled: false
