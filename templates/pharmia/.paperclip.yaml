schema: "paperclip/v1"
# Every agent below uses the same claude_local adapter; declare it once here and let
# each agent override only its model via the `model:` shorthand. Any agent needing a
# different adapter can still add an explicit `adapter:` block (it overrides these).
adapterDefaults:
  type: "claude_local"
  config:
    dangerouslySkipPermissions: true
agents:
  ceo:
    role: "ceo"
    model: "claude-opus-4-6"
  bug-hunter:
    role: "qa"
    model: "claude-opus-4-6"
  devops:
    role: "devops"
    model: "claude-sonnet-4-6"
  e2e:
    role: "qa"
    model: "claude-sonnet-4-6"
  engineering-lead:
    role: "cto"
    model: "claude-opus-4-6"
  implementer:
    role: "engineer"
    model: "claude-sonnet-4-6"
  quebec-legal:
    role: "legal"
    model: "claude-opus-4-6"
  pharmacy-lead:
    role: "pharmacy"
    model: "claude-opus-4-6"
  reflect:
    role: "meta"
    model: "claude-opus-4-6"
  planner:
    role: "pm"
    model: "claude-opus-4-6"
  researcher:
    role: "researcher"
    model: "claude-sonnet-4-6"
  reviewer:
    role: "qa"
    model: "claude-opus-4-6"
  security-agent:
    role: "security"
    model: "claude-sonnet-4-6"
  ai-product-observer:
    role: "observer"
    model: "claude-opus-4-6"
  clinical-flow-observer:
    role: "observer"
    model: "claude-opus-4-6"
  platform-observer:
    role: "observer"
    model: "claude-opus-4-6"
  growth-lead:
    role: "cmo"
    model: "claude-opus-4-6"
  market-intel:
    role: "analyst"
    model: "claude-opus-4-6"
  lead-scout:
    role: "sdr"
    model: "claude-opus-4-6"
  content:
    role: "marketing"
    model: "claude-opus-4-6"
  signup-ingest:
    role: "sdr"
    model: "claude-sonnet-4-6"
  booking-ingest:
    role: "sdr"
    model: "claude-sonnet-4-6"
  translate-fr:
    role: "analyst"
    model: "claude-sonnet-4-6"
company:
  attachmentMaxBytes: 10485760
routines:
  # NOTE: All observer routines below are defined as org-as-code but DISABLED
  # (every trigger enabled: false, routine status: paused). The CTO is preparing
  # the grounds; the VPS host-detector infra is not wired yet, so none should fire.
  # Assignee agent + description are captured as comments because the manifest
  # routine schema only reads triggers / variables / concurrencyPolicy /
  # catchUpPolicy / status. Assignee + description bind at the TASK.md level.
  code-health:
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 9 * * 1"
        label: "Weekly Monday morning"
        timezone: "UTC"
  weekly-growth-brief:
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 13 * * 1"
        label: "Weekly Monday afternoon"
        timezone: "UTC"

  # ── Dependency & service release watch (WEBHOOK) ──────────────────────────
  # assignee: code-health
  # purpose: judge ONE GitHub release per fire (worthwhile vs premature). The n8n
  #          "Dep & Service Release Watch" workflow polls releases.atom feeds
  #          (derived from package.json + service map), dedups, and POSTs each new
  #          release here. No cron in paperclip — paperclip only receives + judges.
  # prompt SSOT: templates/pharmia/tasks/dep-release-watch/TASK.md
  # DISABLED until the n8n watcher is deployed + the webhook secret is wired.
  dep-release-watch:
    status: "paused"
    triggers:
      -
        kind: "webhook"
        label: "n8n release-watcher"
        signingMode: "bearer"
        enabled: false

  # ── n8n → paperclip migrations (2026-06-13) ───────────────────────────────
  # Replace live n8n workflows with paperclip routines. PAUSED + every trigger
  # enabled:false until the Forgejo webhook secret and the content agent's
  # deployed-runtime capabilities (Discord post, WordPress via the wp-pharmia CLI) are wired.
  # Prompt SSOT in tasks/<name>/TASK.md; assignee binds there.
  #
  # assignee: content — replaces n8n "Pharmia Github Notifications" (XqWpwDlBJwxbdQCi).
  #   Forgejo push to `qa` → FR pharmacist changelog → Discord #qa-updates.
  #   signingMode github_hmac accepts Forgejo's X-Hub-Signature-256 (GitHub-compatible).
  qa-changelog:
    status: "paused"
    triggers:
      -
        kind: "webhook"
        label: "Forgejo push (PharmaMate)"
        signingMode: "github_hmac"
        enabled: false
  #
  # assignee: content — replaces the 4-workflow n8n SEO pipeline (SEO Pharmia
  #   g6sl2x0XV15ao3dP + Relevance rOjfyJYMXgmBOChS + SEO+LinkedIn 3zhDw1vfDRfomPfZ
  #   + Templated 4IbUiJx7Xly8Hvad). Weekly: QC-health RSS → PLG-SEO relevance gate →
  #   WordPress + LinkedIn DRAFTS → Discord approval. Scheduled 2h before weekly-growth-brief
  #   (0 13) which reports what it shipped. Research=bx+Jina, WordPress=wp-pharmia CLI (both wired 2026-06-14).
  #   Carousel render + LinkedIn auto-post remain capability-gaps — see tasks/seo-content-run/TASK.md.
  seo-content-run:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 11 * * 1"
        label: "Weekly Monday morning (before Growth Brief)"
        timezone: "UTC"
        enabled: false

  # ── Tier-A host detectors (SCHEDULE) ──────────────────────────────────────
  # Tier-A host-detector
  # assignee: ai-product-observer
  # purpose: Atlas thread/tool-health — unrendered tags, fabricated data, tool failures;
  #          + external clinical tools return expected shape (merged from daily-clinical-tool-health)
  #          + capability-gap detection (over-search / webSearch-fallback / missing-info -> upgrade suggestions)
  # prompt SSOT: templates/pharmia/tasks/daily-atlas-tool-health/TASK.md
  daily-atlas-tool-health:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 10 * * *"
        label: "Daily Atlas health"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: platform-observer
  # purpose: Grafana fired-vs-expected + poller-cursor drops
  # prompt SSOT: templates/pharmia/tasks/daily-alert-health/TASK.md
  daily-alert-health:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "30 9 * * *"
        label: "Daily alert health"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: clinical-flow-observer
  # purpose: Consult forms never isComplete, confirm dead-ends
  daily-consultation-flow-health:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "5 10 * * *"
        label: "Daily consultation-flow health"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: security-agent
  # purpose: audit_log triggers installed, controls still fire (401 spikes → Grafana alert)
  daily-auth-integrity:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "45 9 * * *"
        label: "Daily auth integrity"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: ai-product-observer
  # purpose: Judge + USD-cost deltas vs baseline
  weekly-eval-drift:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 6 * * 2"
        label: "Weekly eval drift"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: ai-product-observer
  # purpose: Breaker/park/rescue + ring review (consumes atlas-report.ts)
  weekly-model-ring-review:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 9 * * 1"
        label: "Weekly model-ring review"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: security-agent
  # purpose: Every router declares a tenant policy
  weekly-authz-regression-audit:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 7 * * 2"
        label: "Weekly authz-regression audit"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: security-agent
  # purpose: Deployed Autumn config vs autumn.config.ts
  weekly-autumn-billing-drift:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 8 * * 2"
        label: "Weekly Autumn billing drift"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: clinical-flow-observer
  # purpose: Consent re-prompt coverage + audit writes
  weekly-consent-compliance-drift:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 9 * * 3"
        label: "Weekly consent-compliance drift"
        timezone: "UTC"
        enabled: false
  # Tier-A host-detector
  # assignee: quebec-legal
  # purpose: comp TGV status + RAMQ infolettre check
  monthly-regulatory-drift:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 6 1 * *"
        label: "Monthly regulatory drift"
        timezone: "UTC"
        enabled: false

  # ── Tier-B sandbox routines (WEBHOOK / SCHEDULE) ──────────────────────────
  # Tier-B sandbox-routine
  # assignee: ai-product-observer
  # purpose: Sweep Inbox for detector Issues lacking an RCA verdict
  observer-issue-triage:
    status: "paused"
    triggers:
      -
        kind: "schedule"
        cronExpression: "0 11 * * *"
        label: "Daily observer issue triage"
        timezone: "UTC"
        enabled: false
  # Tier-B sandbox-routine
  # assignee: clinical-flow-observer
  # purpose: On echo-analyzer/STT/phone-config diff, assert bench-* ran + no ZDR-voiding key
  analyzer-stt-zdr-gate:
    status: "paused"
    triggers:
      -
        kind: "webhook"
        label: "echo-analyzer/STT/phone-config diff"
        timezone: "UTC"
        enabled: false
  # Tier-B sandbox-routine
  # assignee: e2e
  # purpose: Playwright mobile suite on web/web-next change (also wants a daily synthetic)
  mobile-webview-guard:
    status: "paused"
    triggers:
      -
        kind: "webhook"
        label: "web/web-next change"
        timezone: "UTC"
        enabled: false
