services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paperclip
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U paperclip -d paperclip
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    # Tag the built image so the one-shot `import` service can reuse it without a
    # second build (compose builds `server` once, `import` pins the same tag).
    image: paperclip-server:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_POCKET_ID_ENABLED: "true"
        VITE_DISABLE_SIGNUP: "true"
    environment:
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip
      PORT: "3100"
      HOST: 0.0.0.0
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      # Durable per-agent AGENT_HOME base on the SSH-remote agent host. The
      # claude-local adapter rebases AGENT_HOME onto <base>/<agent-id> for remote
      # runs (server-utils.ts refreshPaperclipWorkspaceEnvForExecution), so
      # para-memory persists on the agent VPS instead of a phantom control-plane
      # dir. Only applies when execution is remote; a no-op for local runs.
      # This makes the AGENT_HOME correct by construction and retires the
      # post-import DB patch that used to fix it up.
      PAPERCLIP_AGENT_HOME_BASE: ${PAPERCLIP_AGENT_HOME_BASE:-/home/agent/.paperclip/agents}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Claude via the Bento LiteLLM gateway (llm.bentostudio.io) — SUBSCRIPTION auth, no API
      # billing. CLAUDE_CODE_OAUTH_TOKEN here is a per-consumer LiteLLM VIRTUAL KEY (revocable,
      # budgeted, observable in Langfuse), NOT the real `claude setup-token` — that lives only
      # in the gateway's claude-bridge sidecar, never here. ANTHROPIC_BASE_URL points the claude
      # CLI at the gateway; the bridge injects the real subscription token upstream. The
      # claude-local adapter's Agent SDK spawns the claude CLI, which honors both vars. Both
      # values in Dokploy env only, never the repo. Rotate the virtual key via /key CRUD.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      POCKET_ID_ISSUER: ${POCKET_ID_ISSUER}
      POCKET_ID_CLIENT_ID: ${POCKET_ID_CLIENT_ID}
      POCKET_ID_CLIENT_SECRET: ${POCKET_ID_CLIENT_SECRET}
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: ${PAPERCLIP_AUTH_DISABLE_SIGN_UP}
      PAPERCLIP_TELEMETRY_DISABLED: ${PAPERCLIP_TELEMETRY_DISABLED}
      # Pharmia HTTP-API CLI credentials
      GRAFANA_URL_DEV: ${GRAFANA_URL_DEV:-}
      GRAFANA_URL_QA: ${GRAFANA_URL_QA:-}
      GRAFANA_URL_CANARY: ${GRAFANA_URL_CANARY:-}
      GRAFANA_TOKEN_DEV: ${GRAFANA_TOKEN_DEV:-}
      GRAFANA_TOKEN_QA: ${GRAFANA_TOKEN_QA:-}
      GRAFANA_TOKEN_CANARY: ${GRAFANA_TOKEN_CANARY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      AUTUMN_SECRET_KEY_PROD: ${AUTUMN_SECRET_KEY_PROD:-}
      AUTUMN_SECRET_KEY_SANDBOX: ${AUTUMN_SECRET_KEY_SANDBOX:-}
      AUTUMN_URL: ${AUTUMN_URL:-}
      OUTLINE_URL: ${OUTLINE_URL:-}
      OUTLINE_API_TOKEN: ${OUTLINE_API_TOKEN:-}
      SHLINK_URL: ${SHLINK_URL:-}
      SHLINK_API_KEY: ${SHLINK_API_KEY:-}
      # GitHub App credentials for private repo clones
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
      # HashiCorp Vault — Paperclip secret provider for machine/dev secrets (Vaultwarden stays for
      # human logins, outside the app). Defaults keep the local_encrypted provider when Vault env is
      # unset, so this is safe in any environment. AppRole creds + addr live in Dokploy env only,
      # never the repo. See server/src/secrets/hashicorp-vault-provider.ts + doc/SECRETS-VAULT-PROVIDER.md.
      PAPERCLIP_SECRETS_PROVIDER: ${PAPERCLIP_SECRETS_PROVIDER:-local_encrypted}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      PAPERCLIP_SECRETS_VAULT_PREFIX: ${PAPERCLIP_SECRETS_VAULT_PREFIX:-paperclip}
      VAULT_APPROLE_ROLE_ID: ${VAULT_APPROLE_ROLE_ID:-}
      VAULT_APPROLE_SECRET_ID: ${VAULT_APPROLE_SECRET_ID:-}
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Deploy-time application of the git templates as the single source of truth.
  # Replaces the manual post-push `paperclipai company import` (and the former
  # AGENT_HOME re-apply DB patch, now handled by PAPERCLIP_AGENT_HOME_BASE above):
  # on each deploy this one-shot waits for the server API, then imports
  # /app/templates/pharmia (company + agents + skills) into the existing company.
  # Reuses the server image (no second build) and never blocks `server`.
  import:
    image: paperclip-server:local
    environment:
      # CLI client target + board-actor auth (cli/src/commands/client/common.ts):
      # PAPERCLIP_API_URL is the API base; PAPERCLIP_API_KEY authenticates the import.
      # Use the PUBLIC origin, NOT http://server:3100 — the server 403s any request
      # whose Host is not a trusted origin (on every path, including /api/health),
      # and the internal service name is untrusted. The public URL carries a trusted
      # Host and is reachable from this network (hairpin via Traefik is OK).
      PAPERCLIP_API_URL: ${PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-}
    depends_on:
      server:
        condition: service_started
    restart: "no"
    command:
      - sh
      - -c
      - |
        echo "[import] waiting for server API at $$PAPERCLIP_API_URL/api/health ..."
        i=0
        # Probe the public /api/health through the same base the CLI uses, so
        # readiness also covers the edge (Traefik) routing the import relies on.
        until curl -fsS -o /dev/null "$$PAPERCLIP_API_URL/api/health"; do
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then
            echo "[import] FATAL: server API did not become ready within ~60s" >&2
            exit 1
          fi
          sleep 2
        done
        echo "[import] server ready; importing templates as SSOT ..."
        # --board-full: existing-company replace requires the privileged board_full
        # route (the CEO-safe route rejects replace). PAPERCLIP_API_KEY must belong
        # to an instance-admin or a member of the target company.
        pnpm paperclipai company import /app/templates/pharmia \
          --target existing \
          --company-id 57cd0843-fe5a-42d5-a6f6-c4e896fee84e \
          --collision replace \
          --board-full \
          --include company,agents,skills \
          --yes \
          || { echo "[import] FATAL: template import failed" >&2; exit 1; }
        echo "[import] templates imported successfully"

  # Read-only Postgres→Prometheus exporter for per-run agent metrics
  # (cost / latency / outcome counts, by agent + company) from `heartbeat_runs`.
  # The Paperclip DB (`db`) is only reachable on this compose's default network,
  # so the exporter lives here and also joins the Pharmia-dev observability bridge
  # so the existing Prometheus (pharmia-dev-kwvuth) can scrape it by container name.
  # Read-only: same DB creds, only runs the SELECTs in the queries file. Not a
  # fork-core edit (AGENTS.md §12) — compose + SQL only.
  agent-metrics:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip?sslmode=disable
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "true"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "true"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./docker/paperclip-agent-metrics.queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - pharmia-dev-monitoring
    restart: unless-stopped

networks:
  # External: the Pharmia-dev observability bridge where Prometheus/Grafana/Loki run
  # (created 2025-12-27, stable across redeploys). Lets Prometheus scrape `agent-metrics`
  # by container name. If the Pharmia-dev Dokploy project is ever recreated, this hashed
  # name changes — update here AND in PharmaMate tooling/grafana/prometheus.yml.
  pharmia-dev-monitoring:
    external: true
    name: pharmia-dev-kwvuth

volumes:
  pgdata:
  paperclip-data:
